name: Scrape Used Car Prices

on:
  schedule:
    # 每周日 美东凌晨 4 点 = UTC 周日 08:00
    # 10 城 × 11 车 ≈ 110 次/周 ≈ 473 次/月，正好在免费档 500 次/月以内
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python probe_maybach.py

      - name: Commit updated price data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update used-car prices"
            git push
          fi
